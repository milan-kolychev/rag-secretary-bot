[project]
name = "rag-secretary-bot"
version = "0.1.0"
description = "RAG-система для секретарей ФПИ: Telegram-бот и API ядра"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.20,<1",
    "aiogram>=3.31,<4",
    "fastapi>=0.142,<1",
    "flagembedding>=1.3,<2",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.15,<3",
    "pymupdf>=1.24,<2",
    "python-docx>=1.1,<2",
    "qdrant-client>=1.14,<2",
    "transformers>=4.44,<5",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26",
    "mypy>=2.3",
    "pdoc>=16.0",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pyyaml>=6.0",
    "ruff>=0.16",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Mockup screen texts are content, not code.
"docs/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_also = ['if __name__ == "__main__":']
