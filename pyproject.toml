[project]
name = "rag-secretary-bot"
version = "0.1.0"
description = "Telegram-бот для ответов на учебные вопросы студентов ФПИ по документам факультета"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4",
    "pydantic-settings>=2.15,<3",
]

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pdoc>=16.0",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_also = ['if __name__ == "__main__":']
